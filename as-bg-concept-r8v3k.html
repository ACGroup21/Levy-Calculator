<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Background Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--muted:#6B5F66;--line:#E4DCE0;--card:#fff;--page:#F4F1F2;--plum:#9C3064;--pink:#FF4FA3;
  --bg:#FFFFFF;--bg-a:#FBF6F7;--bg-b:#F9F9F9;--bg-c:#F7EEF2;--orb-op:.42;--o1:#F6B6CF;--o2:#E8C3D6;--o3:#F9D7C9;--dot:156,48,100;--glow:rgba(229,138,184,.35)}
:root[data-theme=dark]{--ink:#F3EEF1;--muted:#B3A5AD;--line:#3A2E35;--card:#1B1418;--page:#0d0a0c;--plum:#E58AB8;
  --bg:#141013;--bg-a:#160F14;--bg-b:#120E11;--bg-c:#1B1118;--orb-op:.30;--o1:#6E1F47;--o2:#4A2340;--o3:#5A2A2A;--dot:229,138,184;--glow:rgba(110,31,71,.55)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "Open Sans",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
h1{font:800 30px/1.15 Montserrat,sans-serif;margin:0 0 6px}
.intro{color:var(--muted);max-width:860px;margin:0 0 16px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:#F39AC2;color:#000}
.opt{margin:0 0 26px}
.opt .tag{font:700 11px/1 "Open Sans";letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
.opt h2{font:800 18px/1.2 Montserrat,sans-serif;margin:4px 0 2px}
.opt p{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:900px}
.pros{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.pros li::before{font-weight:700;margin-right:6px}.pros .p::before{content:"+";color:#1F7A4D}.pros .c::before{content:"–";color:#C62828}
/* ---- the mock app ---- */
.frame{position:relative;height:400px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.hd .logo{font:700 18px/1 "Open Sans";color:var(--plum);letter-spacing:-.01em}
.hd .t{font:800 13px/1 Montserrat;border-left:1px solid var(--line);padding-left:12px}
.hd .sp{margin-left:auto;display:flex;gap:8px}.hd .sp i{display:block;width:84px;height:26px;border:1px solid var(--line);border-radius:999px}.hd .sp i:last-child{background:#F39AC2;border-color:#F39AC2}
.jb{display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--card);border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.jb .ln{flex:1;height:2px;background:var(--ink)}.jb .ln.on{background:var(--pink)}
.jb .res{background:var(--plum);color:#fff;padding:4px 10px;border-radius:2px}
.cols{flex:1;display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:16px;padding:16px 18px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font:800 16px/1.2 Montserrat}.card h3 b{color:var(--plum);margin-right:6px}
.fld{height:30px;border:1px solid var(--line);border-radius:2px;margin:6px 0 10px;background:var(--card)}
.lbl{font-size:12.5px;color:var(--muted)}
.verdict{border-left:5px solid #1F7A4D}.verdict .k{font-size:10.5px;letter-spacing:.14em;color:#1F7A4D;font-weight:700}
.verdict .h{font:800 28px/1.1 Montserrat;margin:2px 0 4px}
.txt{font-size:13px;color:var(--ink)}
.gap{height:26px}
/* A: original orbs, exactly as built (scaled to this frame) */
.b-orbs{background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 45%,var(--bg-c) 100%)}
.b-orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--orb-op)}
.b-orbs .o1{width:46%;aspect-ratio:1;background:var(--o1);left:-12%;top:4%;animation:bg1 26s ease-in-out infinite alternate}
.b-orbs .o2{width:40%;aspect-ratio:1;background:var(--o2);right:-10%;top:-20%;animation:bg2 31s ease-in-out infinite alternate}
.b-orbs .o3{width:34%;aspect-ratio:1;background:var(--o3);left:30%;bottom:-30%;animation:bg3 23s ease-in-out infinite alternate}
.b-orbs .o4{width:20%;aspect-ratio:1;background:#E6007E;opacity:.10;right:18%;bottom:12%;animation:bg1 19s ease-in-out infinite alternate-reverse}
@keyframes bg1{to{transform:translate(14%,10%) scale(1.15)}}
@keyframes bg2{to{transform:translate(-12%,14%) scale(.9)}}
@keyframes bg3{to{transform:translate(-10%,-12%) scale(1.1)}}
/* B: calm plum orbs (Boardroom-tuned: plum/blush only, fainter, slower) */
.b-calm{background:var(--bg)}
.b-calm i{position:absolute;border-radius:50%;filter:blur(70px);opacity:calc(var(--orb-op)*.55)}
.b-calm .o1{width:50%;aspect-ratio:1;background:#E9A9C6;left:-15%;top:10%;animation:bg1 44s ease-in-out infinite alternate}
.b-calm .o2{width:44%;aspect-ratio:1;background:#D9B3C7;right:-12%;top:-18%;animation:bg2 52s ease-in-out infinite alternate}
.b-calm .o3{width:36%;aspect-ratio:1;background:#C77DA2;left:38%;bottom:-32%;animation:bg3 38s ease-in-out infinite alternate}
:root[data-theme=dark] .b-calm .o1{background:#5E1E40}:root[data-theme=dark] .b-calm .o2{background:#3E1F36}:root[data-theme=dark] .b-calm .o3{background:#6E1F47}
/* C: one soft glow that slowly orbits */
.b-glow{background:var(--bg)}
.b-glow i{position:absolute;width:70%;aspect-ratio:1;left:15%;top:-20%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);animation:orbit 40s linear infinite}
@keyframes orbit{0%{transform:translate(-20%,0)}25%{transform:translate(0,18%)}50%{transform:translate(22%,0)}75%{transform:translate(0,-12%)}100%{transform:translate(-20%,0)}}
/* D: dot field (canvas) */
.b-dots{background:var(--bg)}
.b-dots canvas{position:absolute;inset:0;width:100%;height:100%}
/* E: silk lines */
.b-silk{background:var(--bg)}
.b-silk svg{position:absolute;inset:-10% -5%;width:110%;height:120%}
.b-silk path{fill:none;stroke:var(--plum);stroke-width:1.2;opacity:.14}
.b-silk g{animation:silk 30s ease-in-out infinite alternate}
.b-silk g:nth-child(2){animation-duration:38s;animation-direction:alternate-reverse}
@keyframes silk{to{transform:translate(-4%,3%)}}
/* F: plain (today) */
.b-plain{background:var(--bg)}
@media (prefers-reduced-motion:reduce){.bg *{animation:none!important}}
@media (max-width:720px){.cols{grid-template-columns:1fr}.cols > div:first-child{display:none}.hd .sp i{width:40px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>App background concepts</h1>
  <p class="intro">Each option is the real app layout (header, journey bar, form and result cards) with a different background behind it. The cards stay solid, so the background only shows in the gaps around them. Switch between light and dark to check both.</p>
  <div class="ctl"><div class="seg" id="theme"><button type="button" data-t="light" aria-pressed="true">Light</button><button type="button" data-t="dark" aria-pressed="false">Dark</button></div></div>
  <div id="opts"></div>
</div>
<script>
const OPTS=[
 {id:'orbs',tag:'Option A · the original',name:'Drifting colour orbs',p:'The background the app had before Boardroom became the default, exactly as built: four soft pink and peach orbs drifting slowly behind everything.',pro:['Already built and tested','Warm, on brand'],con:['Peach tones do not match the plum Boardroom style']},
 {id:'calm',tag:'Option B · recommended',rec:true,name:'Calm plum orbs',p:'The same idea retuned for Boardroom: plum and blush only, about half as strong, and much slower (40 to 50 seconds per drift).',pro:['Matches the plum accents','Barely noticeable, never distracting'],con:['Very subtle on bright screens']},
 {id:'glow',tag:'Option C',name:'Single orbiting glow',p:'One large soft plum light that circles slowly behind the page, like a spotlight just out of view.',pro:['Simplest; one element','Gives depth without pattern'],con:['Brighter on one side at a time']},
 {id:'dots',tag:'Option D',name:'Rippling dot field',p:'A fine grid of faint plum dots with a slow wave running through it, so the dots gently swell and shrink.',pro:['Feels technical and precise','Texture rather than colour'],con:['Pattern can feel busy behind forms']},
 {id:'silk',tag:'Option E',name:'Silk lines',p:'A few thin plum curves, like ribbon or lingerie seams, drifting very slowly.',pro:['Most on brand for Ann Summers','Elegant, low contrast'],con:['Lines can look like dividers if too strong']},
 {id:'plain',tag:'Option F · today',name:'Plain',p:'Today’s Boardroom background: plain white (or near-black in dark mode).',pro:['Cleanest, nothing moves'],con:['No sense of life behind the app']}
];
const MOCK=`<div class="app"><div class="hd"><span class="logo">Ann Summers</span><span class="t">Apprentice Eligibility Checker</span><span class="sp"><i></i><i></i></span></div>
 <div class="jb">01 Apprentice<span class="ln on"></span>02 Apprenticeship<span class="ln"></span>03 Checks<span class="ln"></span>04 Timing<span class="ln"></span><span class="res">✓ Eligible</span></div>
 <div class="cols"><div><div class="card"><h3><b>01</b>The apprentice</h3><div class="lbl">Name</div><div class="fld"></div><div class="lbl">Date of birth</div><div class="fld"></div></div><div class="gap"></div></div>
 <div><div class="card verdict"><div class="k">FUNDING ELIGIBILITY</div><div class="h">Eligible</div><div class="txt">Jordan is eligible for apprenticeship funding. They’ll be 19 at the planned start.</div></div><div class="card"><h3>Best time to onboard</h3><div class="txt">Earliest start date: 4 Jan 2027</div></div></div></div></div>`;
const BG={orbs:'<i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i>',calm:'<i class="o1"></i><i class="o2"></i><i class="o3"></i>',glow:'<i></i>',dots:'<canvas></canvas>',
 silk:`<svg viewBox="0 0 1000 400" preserveAspectRatio="none"><g><path d="M-50 120 C 200 40, 380 220, 620 120 S 980 60, 1100 160"/><path d="M-50 300 C 240 220, 420 380, 700 280 S 960 220, 1100 320"/></g><g><path d="M-50 200 C 180 260, 360 100, 600 200 S 900 300, 1100 180"/></g></svg>`,plain:''};
const box=document.getElementById('opts');
OPTS.forEach(o=>{ const s=document.createElement('section'); s.className='opt';
  s.innerHTML=`<div class="tag">${o.tag}</div><h2>${o.name}</h2><p>${o.p}</p><div class="frame"><div class="bg b-${o.id}">${BG[o.id]}</div>${MOCK}</div><ul class="pros">${o.pro.map(x=>`<li class="p">${x}</li>`).join('')}${o.con.map(x=>`<li class="c">${x}</li>`).join('')}</ul>`;
  box.appendChild(s); });
// dot field: faint plum dots, a slow wave changes their size
(function(){ const c=document.querySelector('.b-dots canvas'); if(!c) return; const g=c.getContext('2d'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const r=c.getBoundingClientRect(), d=devicePixelRatio||1; c.width=r.width*d; c.height=r.height*d; g.setTransform(d,0,0,d,0,0); }
  size(); addEventListener('resize',size);
  function draw(t){ const w=c.clientWidth,h=c.clientHeight, sp=22, rgb=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim(); g.clearRect(0,0,w,h);
    for(let y=sp/2;y<h;y+=sp) for(let x=sp/2;x<w;x+=sp){ const k=Math.sin(x*.012+y*.018-t*.0006)*.5+.5; const r=.6+k*1.4; g.fillStyle=`rgba(${rgb},${.10+k*.16})`; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill(); }
    if(!reduce) requestAnimationFrame(draw); }
  requestAnimationFrame(draw); })();
document.getElementById('theme').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; document.documentElement.dataset.theme=b.dataset.t; document.querySelectorAll('#theme button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
if(matchMedia('(prefers-color-scheme: dark)').matches) document.querySelector('#theme [data-t=dark]').click();
</script>
</body>
</html>
