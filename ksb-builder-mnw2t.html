<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSB Document Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111a28; --ink-2:#33475e; --muted:#5f7288; --line:#e2e8f1; --line-2:#eef2f7;
    --navy:#071843; --navy-soft:#eef2f9; --navy-line:#c9d6ea;
    --teal:#0f8b95; --teal-deep:#0b6d75; --teal-soft:#edf7f7; --teal-line:#cfe8e8;
    --bg:#ffffff; --canvas:#e9edf2; --chipbg:#f3f7fb; --rule:#c3d0e0;
    --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}

  /* ---------- screen chrome ---------- */
  .chrome{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(7,24,67,.05)}
  .chrome-in{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brandbar{display:flex;align-items:center;gap:11px;flex:none}
  .brandbar .wm{height:22px;width:auto;display:block}
  .brandbar .div{width:1px;height:24px;background:var(--line)}
  .brandbar .tt{font-weight:700;font-size:14px;color:var(--navy);letter-spacing:-.01em;line-height:1.1}
  .brandbar .tt span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:2px}
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:auto}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  select#std{font-family:var(--sans);font-size:12.5px;color:var(--ink);padding:7px 10px;border:1px solid var(--navy-line);border-radius:7px;background:#fff;min-width:300px;max-width:60vw}
  .modes{display:inline-flex;background:var(--chipbg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
  .modes button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:transparent;border:none;border-radius:6px;padding:6px 12px;cursor:pointer}
  .modes button.on{background:var(--navy);color:#fff}
  .btn-pdf{font-family:var(--sans);font-size:12.5px;font-weight:700;color:#fff;background:var(--teal-deep);border:none;border-radius:8px;padding:9px 16px;cursor:pointer}
  .btn-pdf:hover{background:#0a5e66}
  .statusline{max-width:980px;margin:0 auto;padding:0 20px 11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .cbadge{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:20px;border:1px solid}
  .cbadge.yes{color:var(--teal-deep);background:var(--teal-soft);border-color:var(--teal-line)}
  .cbadge.no{color:#9a6a12;background:#fdf6e8;border-color:#f0dfb8}
  .hint{font-size:11px;color:var(--muted)}
  .hint b{color:var(--ink-2)}

  /* ---------- the page/sheet ---------- */
  .stage{max-width:980px;margin:0 auto;padding:22px 20px 60px}
  .sheet{background:#fff;max-width:820px;margin:0 auto;padding:26px 30px 30px;border-radius:3px;box-shadow:0 4px 26px rgba(7,24,67,.12)}
  @media (max-width:560px){ .sheet{padding:18px} }

  header.doc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--navy);padding-bottom:14px}
  .brand .wm{height:26px;display:block}
  .brand .tag{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:7px}
  .docmeta{text-align:right;font-family:var(--mono);font-size:8.5px;line-height:1.7;color:var(--muted)}
  .docmeta b{color:var(--ink)}

  .title{margin-top:16px}
  .title .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:600}
  .title h1{font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--navy);margin-top:5px;line-height:1.05}
  .title .sub{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);background:var(--chipbg);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
  .chip b{color:var(--teal)}
  .overview{margin-top:12px;font-size:10.5px;color:var(--ink-2);line-height:1.55;font-style:italic;border-left:2px solid var(--teal);padding-left:11px}

  .idblock{margin-top:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .idf{display:flex;flex-direction:column;gap:5px}
  .idf .il{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .idf .iv{border-bottom:1.4px solid var(--rule);height:16px}

  .banner{margin-top:14px;background:#fdf6e8;border:1px solid #f0dfb8;border-radius:8px;padding:9px 12px;font-size:10px;color:#7a5a12;line-height:1.5}
  .banner b{color:#5f470e}

  .legend{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;padding:9px 12px;background:var(--chipbg);border:1px solid var(--line);border-radius:8px}
  .legend .li{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:150px}
  .legend .k{font-family:var(--mono);font-weight:600;font-size:11px;color:#fff;background:var(--navy);border-radius:5px;padding:2px 7px;flex:none}
  .legend .d{font-size:9.2px;color:var(--ink-2);line-height:1.4}
  .legend .d b{color:var(--navy);display:block;font-size:9.6px;margin-bottom:1px}

  .section{margin-top:20px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sec-head .n{font-family:var(--mono);font-size:9px;font-weight:600;color:#fff;background:var(--navy);border-radius:5px;padding:3px 8px;letter-spacing:.04em}
  .sec-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
  .sec-head .cnt{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:auto}

  .group{margin-bottom:12px}
  .gh{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep);font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--line-2);margin-bottom:7px}
  .row{display:flex;gap:9px;padding:4px 0;border-bottom:1px solid var(--line-2)}
  .row:last-child{border-bottom:none}
  .chk{flex:none;width:12px;height:12px;border:1.4px solid var(--navy);border-radius:3px;margin-top:2px;background:#fff}
  .code{flex:none;width:30px;font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--teal);padding-top:.5px}
  .txt{flex:1;font-size:10px;color:var(--ink);line-height:1.45}

  .practice{background:var(--teal-soft);border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:7px 11px;margin:7px 0}
  .practice .pl{font-family:var(--mono);font-size:7.6px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep);font-weight:600;margin-bottom:3px}
  .practice p{font-size:9.7px;color:var(--ink-2);line-height:1.5}
  .practice p b{color:var(--navy);font-weight:600}
  .reality{background:var(--navy-soft);border-left:3px solid var(--navy);border-radius:0 6px 6px 0;padding:7px 11px;margin:7px 0}
  .reality .pl{font-family:var(--mono);font-size:7.6px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .reality .pl::before{content:"\25B8";color:var(--teal);font-size:10px}
  .reality p{font-size:9.7px;color:var(--ink-2);line-height:1.5}
  .reality p b{color:var(--navy);font-weight:600}
  .ev{border:1.2px dashed var(--navy-line);border-radius:6px;padding:8px 11px 6px;margin-top:8px}
  .ev .evlabel{font-family:var(--mono);font-size:7.6px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between}
  .ev .evlabel .date{color:var(--navy)}
  .evline{height:19px;border-bottom:1px solid var(--line)}
  .evline:last-child{border-bottom:none}

  footer.doc-f{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:7.6px;color:var(--muted);letter-spacing:.02em}
  footer.doc-f .src b{color:var(--ink-2)}
  .navyword{color:var(--navy);font-weight:800;letter-spacing:.01em}
  .tealword{color:var(--teal)}

  .empty{padding:40px;text-align:center;color:var(--muted);font-size:12px}
  .loaderr{margin-top:14px}
  .loaderr input[type=file]{font-size:12px;margin-top:8px}

  /* ---------- print ---------- */
  @page{ size:A4; margin:13mm 13mm 14mm; }
  @media print{
    html,body{background:#fff}
    .chrome,.stage-tools{display:none !important}
    .stage{max-width:none;margin:0;padding:0}
    .sheet{box-shadow:none;border-radius:0;max-width:none;margin:0;padding:0}
    .section,.group,.row,.practice,.reality,.ev,.legend,.idblock,.sec-head,.intro{break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

/* ============================================================
   Curated coaching overlay — keyed by standard reference.
   Supplies ONLY: sub-group names, "In practice", "In reality".
   KSB TEXT always comes from the canonical standards.json.
   Seeded with ST0071. Add more standards here over time.
   ============================================================ */
const COACHING = {
  ST0071: {
    K: [
      { title:"Business knowledge & understanding", codes:["K1","K2","K3","K4","K5"],
        practice:"See past the single conversation to how your service fits the <b>whole business</b> — you can explain why a change you'd suggest saves money or wins loyalty, and you flex your <b>leadership style</b> to the moment.",
        reality:"Pick one thing that slows customers down. Write a short note to your manager: what you'd change and the <b>business benefit</b> (time saved, repeat contacts avoided, loyalty). Keep the note as evidence." },
      { title:"Knowing your customers & their needs", codes:["K6","K7","K8","K9"],
        practice:"You understand the customer's <b>whole journey</b> — where it runs smoothly and where it hurts — and you stay inside your <b>authority</b> while still landing a good outcome, escalating when you should.",
        reality:"Map one customer's journey <b>end-to-end</b> on a single page — every step, every hand-off, and the point where it usually goes wrong. Mark where your authority ends and where you'd escalate." },
      { title:"Customer insight", codes:["K10","K11","K12","K13","K14"],
        practice:"You <b>read customers</b> and adapt — a frustrated first-time caller needs reassurance; a repeat client needs speed — and you know expectations shift with <b>culture, age and background</b>, so one script never fits all.",
        reality:"Take a week of feedback or contact reasons and <b>group them into customer types</b>. Note one approach that works for each type, and one that backfires." },
      { title:"Customer service culture & environment awareness", codes:["K15","K16","K17","K18"],
        practice:"You know the <b>rules of the road</b> and how your role sits in the wider organisation — the regulations that touch customers, which department does what when things go wrong, and where to find <b>best practice</b>.",
        reality:"List the <b>top 3 regulations</b> that touch your role (e.g. GDPR, consumer rights). For each, write one line on what it means for how you handle a customer. Add one best-practice idea from outside your team." }
    ],
    S: [
      { title:"Business-focused service delivery", codes:["S1","S2","S3"],
        practice:"You <b>solve, not just soothe</b> — choosing from several approaches rather than defaulting to one, and landing a solution that works for the customer <b>and</b> the business.",
        reality:"Take one complex case you resolved. Write up the <b>two or three approaches</b> you considered, which you chose and why, and how the outcome worked for both the customer and the business." },
      { title:"Providing a positive customer experience", codes:["S4","S5","S6","S7","S8","S9","S10"],
        practice:"This is the <b>craft of the conversation</b> — you question and listen to a shared outcome, offer options rather than a flat “no”, stay cost-aware, and turn complex information into plain language.",
        reality:"Write up one conversation where you turned a <b>“no” into agreed next steps</b>. Highlight where you questioned, summarised, offered options, and simplified something complex." },
      { title:"Working with your customers & their insights", codes:["S11","S12"],
        practice:"You <b>gather what customers tell you</b> and turn it into action — collecting feedback, working out what it really means, and using it to <b>anticipate</b> what a type of customer will need before they ask.",
        reality:"Gather feedback through <b>two different methods</b> (e.g. a survey plus call notes). Write a short summary of what it told you and one change you made or suggested because of it." },
      { title:"Customer service performance", codes:["S13","S14"],
        practice:"You <b>hold the relationship</b> even when you can't give the answer they wanted, and when you escalate you carry the <b>history</b> with you so the customer never repeats their story from scratch.",
        reality:"Find a case where you kept a customer <b>on-side without giving them what they wanted</b>. Note what you said, and — for an escalation — what history you passed on." },
      { title:"Service improvement", codes:["S15","S16","S17"],
        practice:"You <b>leave the service better than you found it</b> — looking end-to-end for where it breaks, pulling in colleagues, and turning findings into concrete recommendations you put in place where you can.",
        reality:"Pick one part of the service that breaks. <b>Analyse it end-to-end</b>, ask a colleague for input, and write a short recommendation. If you can implement even a small part, note what changed." }
    ],
    B: [
      { title:"Develop self", codes:["B1","B2"],
        practice:"You <b>take charge of your own growth</b> — keeping your knowledge current without being told to, and setting yourself real service goals you chip away at.",
        reality:"Set one <b>service-related goal</b> for the next month and write the steps. Log one thing you did this month to keep your knowledge current (a course, article, shadowing)." },
      { title:"Ownership & responsibility", codes:["B3","B4","B5"],
        practice:"You <b>own the outcome</b>, not just your part — seeing an issue through, getting creative when the obvious fix won't work, and only <b>promising what you can deliver</b>, then delivering it.",
        reality:"Keep a short <b>log of promises</b> you made to customers and whether you delivered on time. Add one case where you found a creative fix when the standard one wouldn't work." },
      { title:"Team working", codes:["B6","B7","B8"],
        practice:"Good service is a <b>team sport</b> — you work well with colleagues at every level, treat them as customers too (a clean handover is a service), and <b>share what you know</b>.",
        reality:"Do one <b>clean handover</b> to a colleague and note how you set them up to succeed. Share one thing you learned with your team and record how you shared it." },
      { title:"Equality — treating all customers as individuals", codes:["B9","B10"],
        practice:"Every customer is a <b>person, not a ticket</b> — you tailor your service to who's in front of you while staying within the standards your organisation sets.",
        reality:"Note <b>two customers with very different needs</b> and how you adapted your service for each — while staying within your organisation's standards." },
      { title:"Presentation — right first time", codes:["B11","B12"],
        practice:"In that moment, <b>you are the brand</b> — you represent your organisation's values so customers trust what you say, and everything from tone on a call to spelling in an email reflects well.",
        reality:"Pick one <b>email and one call</b> from this week. Review them as the customer would: does tone, accuracy and presentation reflect well on the brand? Note one thing to keep and one to improve." }
    ]
  }
};

const CAT = { K:"Knowledge", S:"Skills", B:"Behaviours" };
const CAT_LEAD = {
  K:"What you need to understand about the role and how good work creates value.",
  S:"What you'll actually do — the craft, applied in real situations.",
  B:"How you show up — the habits and attitude that make the knowledge and skills count."
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const numOf = c => parseInt(String(c).replace(/^[A-Za-z]+/,''),10) || 0;
const sortCodes = arr => arr.slice().sort((a,b)=>numOf(a)-numOf(b));

let DATA = null, CUR = null, MODE = 'reference';

function order( ref, cat, ksbObj ){
  // returns [{title|null, rows:[[code,text]...], coach:{practice,reality}|null}]
  const cur = COACHING[ref] && COACHING[ref][cat];
  const codes = sortCodes(Object.keys(ksbObj||{}));
  if(cur){
    const used = new Set();
    const groups = cur.map(g=>{
      const rows = g.codes.filter(c=>ksbObj[c]!=null).map(c=>{used.add(c);return [c, ksbObj[c]];});
      return { title:g.title, rows, coach:{practice:g.practice, reality:g.reality} };
    }).filter(g=>g.rows.length);
    const left = codes.filter(c=>!used.has(c));
    if(left.length) groups.push({ title:"Further "+CAT[cat].toLowerCase(), rows:left.map(c=>[c,ksbObj[c]]), coach:null });
    return groups;
  }
  // uncurated: single implicit group, no sub-title, no coaching
  return [{ title:null, rows:codes.map(c=>[c,ksbObj[c]]), coach:null }];
}

function evBox(lines){
  let l=''; for(let i=0;i<lines;i++) l+='<div class="evline"></div>';
  return '<div class="ev"><div class="evlabel"><span>My evidence · where I\'ve shown this</span><span class="date">Date</span></div>'+l+'</div>';
}

function render(){
  const sheet = document.getElementById('sheet');
  if(!CUR){ sheet.innerHTML='<div class="empty">Pick a standard.</div>'; return; }
  const s = CUR;
  const cats = ['K','S','B'];
  const counts = { K:Object.keys(s.K||{}).length, S:Object.keys(s.S||{}).length, B:Object.keys(s.B||{}).length };
  const total = counts.K+counts.S+counts.B;
  const curated = !!COACHING[s.ref];

  // flags per mode
  const showPractice = (MODE==='learner'||MODE==='workbook') && curated;
  const showReality  = (MODE==='workbook') && curated;
  const showChecks   = (MODE==='workbook');
  const showEvidence = (MODE==='workbook');
  const showId       = (MODE==='workbook');
  const showLegend   = (MODE!=='reference');

  const tagMap = { reference:'Apprenticeship standards reference', learner:'Apprenticeship learner guide', workbook:'Apprenticeship evidence workbook' };
  const eyebrow = { reference:'Knowledge · Skills · Behaviours', learner:'Your Knowledge · Skills · Behaviours', workbook:'Knowledge · Skills · Behaviours — evidence workbook' };
  const subMap = {
    reference:'Level '+(s.level||'')+' Apprenticeship — the full KSB framework',
    learner:'Level '+(s.level||'')+' — what you\'ll learn, do and show, in plain English',
    workbook:'Level '+(s.level||'')+' — tick it off, try it out, and note where you\'ve shown it'
  };

  if(total===0){
    sheet.innerHTML = docHead(s,tagMap[MODE],eyebrow[MODE],subMap[MODE],counts) +
      '<div class="banner">This standard has <b>no KSBs in the library yet</b>. The canonical file lists it (funding &amp; duration are accurate), but its Knowledge, Skills &amp; Behaviours haven\'t been pulled in. Nothing to build until they are.</div>' +
      docFoot(s);
    return;
  }

  let html = docHead(s,tagMap[MODE],eyebrow[MODE],subMap[MODE],counts);

  if(MODE==='reference' && s.overview){ /* no overview field in data — skip */ }

  if(showId){
    html += '<div class="idblock">'+
      ['Learner name','Employer','Start date','Next review'].map(l=>'<div class="idf"><span class="il">'+l+'</span><span class="iv"></span></div>').join('')+
      '</div>';
  }

  if(MODE!=='reference'){
    if(!curated){
      html += '<div class="banner">Coaching notes (the “In practice” &amp; “In reality” prompts) are <b>not yet curated</b> for this standard, so this '+(MODE==='workbook'?'workbook':'guide')+' shows the official KSBs'+(MODE==='workbook'?' with tick-boxes and evidence space':'')+' — no invented guidance. Curate this standard to add them.</div>';
    } else {
      html += '<div class="banner" style="background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal-deep)">The <b>“In practice”</b> and <b>“In reality”</b> notes are Arthur Curtis Education guidance to help it land — <b>not</b> part of the official standard. Your provider confirms what counts as evidence.</div>';
    }
  }

  if(showLegend){
    html += '<div class="legend">'+cats.map(c=>'<div class="li"><span class="k">'+c+'</span><span class="d"><b>'+CAT[c]+'</b>'+
      ({K:'What you understand — the “why” behind the work.',S:'What you can do — the craft, in action.',B:'How you show up — the habits that carry it.'}[c])+'</span></div>').join('')+'</div>';
  }

  cats.forEach(cat=>{
    const obj = s[cat]||{};
    const n = Object.keys(obj).length;
    if(!n) return;
    const codesSorted = sortCodes(Object.keys(obj));
    const rangeLabel = codesSorted.length ? codesSorted[0]+'–'+codesSorted[codesSorted.length-1] : '';
    html += '<section class="section"><div class="sec-head"><span class="n">'+cat+'</span><h2>'+CAT[cat]+'</h2><span class="cnt">'+rangeLabel+'</span></div>';
    html += '<p style="font-size:10px;color:var(--ink-2);font-style:italic;margin:0 0 10px">'+CAT_LEAD[cat]+'</p>';
    const groups = order(s.ref, cat, obj);
    groups.forEach(g=>{
      html += '<div class="group">';
      if(g.title) html += '<div class="gh">'+esc(g.title)+'</div>';
      html += '<div class="rows">';
      g.rows.forEach(([code,text])=>{
        html += '<div class="row">'+(showChecks?'<span class="chk"></span>':'')+'<div class="code">'+esc(code)+'</div><div class="txt">'+esc(text)+'</div></div>';
      });
      html += '</div>';
      if(showPractice && g.coach) html += '<div class="practice"><div class="pl">In practice</div><p>'+g.coach.practice+'</p></div>';
      if(showReality && g.coach) html += '<div class="reality"><div class="pl">In reality — try this</div><p>'+g.coach.reality+'</p></div>';
      if(showEvidence) html += evBox(g.title?3:6);
      html += '</div>';
    });
    html += '</section>';
  });

  html += docFoot(s);
  sheet.innerHTML = html;
}

function docHead(s,tag,eyebrow,sub,counts){
  const chips = [];
  if(s.level) chips.push('Level <b>'+esc(s.level)+'</b>');
  if(s.duration_months) chips.push('Typical duration <b>'+esc(s.duration_months)+' months</b>');
  if(s.max_funding) chips.push('Funding band <b>£'+Number(s.max_funding).toLocaleString()+'</b>');
  if(counts.K) chips.push('<b>'+counts.K+'</b> Knowledge');
  if(counts.S) chips.push('<b>'+counts.S+'</b> Skills');
  if(counts.B) chips.push('<b>'+counts.B+'</b> Behaviours');
  return '<header class="doc-h"><div class="brand">'+
    '<svg class="wm" viewBox="0 0 1598 240" role="img" aria-label="Arthur Curtis Education"><use href="#wm"/></svg>'+
    '<div class="tag">'+tag+'</div></div>'+
    '<div class="docmeta">Standard ref&nbsp; <b>'+esc(s.ref||'')+'</b><br>Level&nbsp; <b>'+esc(s.level||'')+'</b><br>Route&nbsp; <b>'+esc((s.route||'').split(',')[0])+'</b></div></header>'+
    '<div class="title"><div class="eyebrow">'+eyebrow+'</div><h1>'+esc(s.name||'')+'</h1><div class="sub">'+sub+'</div>'+
    '<div class="chips">'+chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div></div>';
}
function docFoot(s){
  const curated = !!COACHING[s.ref];
  const note = curated
    ? 'KSB text verbatim from <b>Skills England</b> — '+esc(s.name)+' ('+esc(s.ref)+'). “In practice” &amp; “In reality” notes are AC guidance, not part of the standard.'
    : 'KSB text verbatim from <b>Skills England</b> — '+esc(s.name)+' ('+esc(s.ref)+'), via the Arthur Curtis canonical standards library.';
  return '<footer class="doc-f"><span class="src">'+note+'</span>'+
    '<span><span class="navyword">Arthur&nbsp;Curtis</span> <span class="tealword">Education</span> · Making people better</span></footer>';
}

function setBadge(){
  const b=document.getElementById('cbadge'), h=document.getElementById('hint');
  if(!CUR){ b.className='cbadge no'; b.textContent='—'; h.textContent=''; return; }
  const curated = !!COACHING[CUR.ref];
  if(curated){ b.className='cbadge yes'; b.textContent='✓ Coaching notes curated'; h.innerHTML='This standard has hand-written <b>In practice / In reality</b> notes.'; }
  else { b.className='cbadge no'; b.textContent='Coaching notes: not yet curated'; h.innerHTML='Reference &amp; workbook build from the official KSBs. <b>In practice / In reality</b> need curating.'; }
}

function selectStd(ref){
  CUR = DATA.standards[ref] || null;
  setBadge(); render();
}

function buildSelect(){
  const sel=document.getElementById('std');
  const arr=Object.values(DATA.standards).map(s=>({
    ref:s.ref, name:s.name, level:s.level,
    n:(Object.keys(s.K||{}).length+Object.keys(s.S||{}).length+Object.keys(s.B||{}).length),
    cur:!!COACHING[s.ref]
  })).sort((a,b)=> (b.cur-a.cur) || a.name.localeCompare(b.name));
  sel.innerHTML = arr.map(s=>'<option value="'+s.ref+'">'+ (s.cur?'★ ':'') + esc(s.name)+' · '+esc(s.ref)+' · L'+esc(s.level)+ (s.n?'':' · (no KSBs)') +'</option>').join('');
  // default to ST0071 if present
  const def = DATA.standards.ST0071 ? 'ST0071' : arr[0].ref;
  sel.value = def; selectStd(def);
}

function boot(data){
  DATA=data; buildSelect();
  document.getElementById('std').addEventListener('change',e=>selectStd(e.target.value));
  document.getElementById('modes').addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn)return;
    MODE=btn.dataset.mode;
    [...document.querySelectorAll('#modes button')].forEach(b=>b.classList.toggle('on',b===btn));
    render();
  });
  document.getElementById('pdfBtn').addEventListener('click',()=>window.print());
  // deep-link: ?std=ST0071&mode=workbook
  const q=new URLSearchParams(location.search);
  const qs=q.get('std'), qm=q.get('mode');
  if(qs && DATA.standards[qs.toUpperCase()]){ const sel=document.getElementById('std'); sel.value=qs.toUpperCase(); selectStd(sel.value); }
  if(qm && ['reference','learner','workbook'].includes(qm)){ const btn=document.querySelector('#modes button[data-mode="'+qm+'"]'); if(btn) btn.click(); }
}

fetch('standards.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(err=>{
    document.getElementById('sheet').innerHTML =
      '<div class="empty loaderr">Couldn\'t load <b>standards.json</b> automatically ('+esc(err.message)+').<br>'+
      'This page must sit alongside the canonical <code>standards.json</code>, or load it here:<br>'+
      '<input type="file" id="fpick" accept="application/json,.json"></div>';
    const fp=document.getElementById('fpick');
    if(fp) fp.addEventListener('change',ev=>{
      const f=ev.target.files[0]; if(!f)return;
      const rd=new FileReader(); rd.onload=()=>{ try{ boot(JSON.parse(rd.result)); }catch(e){ alert('Invalid JSON: '+e.message);} }; rd.readAsText(f);
    });
  });
</script>
</body>
</html>
