<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamics Options</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#9C3064; --pink:#E6007E; --ink:#000; --text:#3B3935; --muted:#6E6A64; --line:#E4DCD9; --card:#fff; --field:#fff; --field-line:#CFC6C2; --blush:#F6E9E6;
  --o1:#F7A8C8; --o2:#E9B7D0; --logo-fill:#B42A72; --shine:#FFD6EC; --btn-bg:#000; --btn-fg:#fff;
  --stage:radial-gradient(120% 90% at 50% 40%,#FFFFFF 0%,#FBF1F4 45%,#F3D9E3 100%);
  --aurora:linear-gradient(120deg,#FBE1EE,#FFFFFF,#F4CFE2,#FFF3F8,#EFC6DA);
  --page:#F7F2F4; color-scheme:light;
}
:root[data-theme=dark]{
  --plum:#E58AB8; --ink:#F6F1F3; --text:#DCD4D8; --muted:#A99FA5; --line:#3A3237; --card:#1E181C; --field:#272025; --field-line:#4C4249; --blush:#3A2431;
  --o1:#6E1F47; --o2:#4A2340; --logo-fill:#FFFFFF; --shine:#FF7DC0; --btn-bg:#F6F1F3; --btn-fg:#141013;
  --stage:radial-gradient(120% 90% at 50% 40%,#2A1722 0%,#170F14 55%,#0C080B 100%);
  --aurora:linear-gradient(120deg,#2B1222,#120C10,#3A1530,#160E14,#2E1026);
  --page:#100C0F; color-scheme:dark;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
.on-dark{display:none} :root[data-theme=dark] .on-dark{display:block} :root[data-theme=dark] .on-light{display:none}

header{background:#000;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .hlogo{width:150px;height:auto;display:block}
header .app{font-size:13px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#FF8CC6;border-left:1px solid #444;padding:4px 0 4px 18px;align-self:flex-end;margin-bottom:2px}

.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 50px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;position:sticky;top:16px}
.panel h2{margin:0 0 4px;font-size:20px;color:var(--ink);font-weight:600}
.panel p.lead{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.grp{border-top:1px solid var(--line);padding:14px 0 4px}
.grp h3{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:600}
.opts{display:grid;gap:6px}
.opts button{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:start;text-align:left;border:1px solid var(--field-line);background:var(--field);border-radius:6px;padding:8px 10px;cursor:pointer}
.opts button b{grid-row:1/3;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blush);color:var(--ink);font-size:12px;font-weight:600}
.opts button span{font-weight:600;color:var(--ink);font-size:14px}
.opts button small{color:var(--muted);font-size:12px;line-height:1.35}
.opts button em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--pink);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.opts button[aria-pressed=true]{border-color:var(--pink);background:var(--blush);box-shadow:inset 0 0 0 1px var(--pink)}
.opts button[aria-pressed=true] b{background:var(--pink);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--field-line)}
.btn[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
.combo{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.combo b{color:var(--ink);font-weight:500}
.live{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#1F7A4D;color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;font-family:Jost}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;border-radius:8px;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px solid var(--line);background:var(--stage)}
.stage .orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.55;pointer-events:none}
.stage .o1{width:46%;aspect-ratio:1;background:var(--o1);left:-14%;top:-22%;animation:d1 14s ease-in-out infinite alternate}
.stage .o2{width:40%;aspect-ratio:1;background:var(--o2);right:-12%;bottom:-26%;animation:d2 17s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(20%,15%) scale(1.12)}} @keyframes d2{to{transform:translate(-18%,-12%) scale(.92)}}
.stage[data-bg=aurora]{background:var(--aurora);background-size:300% 300%;animation:aurora 9s ease-in-out infinite alternate}
.stage[data-bg=aurora] .orb{display:none}
@keyframes aurora{0%{background-position:0% 40%}100%{background-position:100% 60%}}
.stage[data-bg=still] .orb{animation:none}
.sparkles{position:absolute;inset:0;pointer-events:none;display:none}
.stage[data-bg=sparkle] .sparkles{display:block}
.sparkles i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#FF6FB8;box-shadow:0 0 6px #FF4FB0,0 0 12px #FF4FB0;opacity:0;animation:tw var(--d) var(--w) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
.lw{position:relative;z-index:1;width:min(560px,78%)}
.lw .aslogo{width:100%;height:auto;overflow:visible;display:block}
.stage h4{position:relative;z-index:1;margin:2px 0 0;font-weight:500;font-size:clamp(13px,1.7vw,20px);letter-spacing:.34em;text-transform:uppercase;color:var(--plum);animation:rise .6s 2.0s ease both}
.stage .tag{position:relative;z-index:1;margin:0;font-size:14px;color:var(--text);animation:rise .6s 2.1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- logo intro: A = LED spark (live) ---------- */
.aslogo{--t0:.2s;--step:.12s}
.aslogo .lt{fill:var(--logo-fill);opacity:0;animation:lfill .55s calc(var(--t0) + var(--i)*var(--step) + .38s) ease-out forwards}
@keyframes lfill{0%{opacity:0;filter:drop-shadow(0 0 0 #FF4FB0)}40%{opacity:1;filter:drop-shadow(0 0 5px #FF4FB0)}100%{opacity:1;filter:drop-shadow(0 0 0 transparent)}}
.aslogo .sp,.aslogo .tr{fill:none;stroke-linecap:round;opacity:0;animation:spark .55s calc(var(--t0) + var(--i)*var(--step)) linear forwards}
.aslogo .ap{animation-duration:.45s;animation-delay:calc(var(--t0) + 1.55s)}
.aslogo .sp{stroke:#FFE3F2;stroke-width:1.5;stroke-dasharray:0 16 6 78;filter:drop-shadow(0 0 1.5px #FF4FB0) drop-shadow(0 0 4px #FF2E9A) drop-shadow(0 0 9px #FF2E9A)}
.aslogo .tr{stroke:#FF4FB0;stroke-width:1;stroke-dasharray:22 78;filter:drop-shadow(0 0 3px #FF2E9A)}
@keyframes spark{0%{opacity:0;stroke-dashoffset:0}8%{opacity:1}86%{opacity:1}100%{opacity:0;stroke-dashoffset:-100}}
.aslogo .apl{fill:#E8325E;transform-box:fill-box;transform-origin:50% 88%;opacity:0;animation:apop .75s calc(var(--t0) + 1.8s) cubic-bezier(.3,1.6,.5,1) forwards, beat 2.4s calc(var(--t0) + 2.6s) ease-in-out infinite}
@keyframes apop{0%{opacity:0;transform:scale(.3)}55%{opacity:1;filter:drop-shadow(0 0 12px #FF4FB0)}100%{opacity:1;transform:none;filter:none}}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.12)}16%{transform:scale(.97)}24%{transform:scale(1.07)}34%{transform:scale(1)}}

/* B = neon flicker: letters buzz on in a random order like a neon sign, keep a soft glow */
[data-intro=neon] .aslogo .sp,[data-intro=neon] .aslogo .tr{display:none}
[data-intro=neon] .aslogo .lt{animation:neon 1.1s calc(var(--t0) + var(--o)*.11s) linear forwards}
[data-intro=neon] .aslogo .apl{animation:neon 1s calc(var(--t0) + 1.3s) linear forwards, beat 2.4s calc(var(--t0) + 2.6s) ease-in-out infinite}
@keyframes neon{0%{opacity:0}6%{opacity:.9;filter:drop-shadow(0 0 7px #FF4FB0)}9%{opacity:.08}14%{opacity:1}17%{opacity:.25}24%{opacity:1;filter:drop-shadow(0 0 11px #FF4FB0)}100%{opacity:1;filter:drop-shadow(0 0 3px #FF4FB0)}}

/* C = pen draw: the outline draws itself, then the colour floods in */
[data-intro=draw] .aslogo .sp{display:none}
[data-intro=draw] .aslogo .tr{stroke:var(--logo-fill);stroke-width:.9;stroke-dasharray:100 100;filter:none;animation:draw 1.3s calc(var(--t0) + var(--i)*.07s) cubic-bezier(.5,0,.3,1) forwards}
[data-intro=draw] .aslogo .tr.ap{stroke:#E8325E;animation-delay:calc(var(--t0) + 1.0s);animation-duration:.8s}
[data-intro=draw] .aslogo .lt{animation:flood .7s calc(var(--t0) + 1.1s + var(--i)*.05s) ease-out forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:100}100%{opacity:1;stroke-dashoffset:0}}
@keyframes flood{from{opacity:0}to{opacity:1}}

/* D = gloss shimmer: letters rise in, then a glossy highlight sweeps across the word */
[data-intro=shimmer] .aslogo .sp,[data-intro=shimmer] .aslogo .tr{display:none}
[data-intro=shimmer] .aslogo .lt{fill:url(#asShine);animation:fadeup .6s calc(var(--t0) + var(--i)*.06s) ease-out forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* E = bounce drop: letters drop in one by one, the apple lands on top */
[data-intro=bounce] .aslogo .sp,[data-intro=bounce] .aslogo .tr{display:none}
[data-intro=bounce] .aslogo .lt{transform-box:fill-box;transform-origin:50% 100%;animation:bounce .7s calc(var(--t0) + var(--i)*.09s) cubic-bezier(.3,1.5,.5,1) both}
[data-intro=bounce] .aslogo .apl{animation:appleDrop .9s calc(var(--t0) + 1.2s) cubic-bezier(.3,1.5,.5,1) both, beat 2.4s calc(var(--t0) + 2.6s) ease-in-out infinite}
@keyframes bounce{0%{opacity:0;transform:translateY(-45px)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes appleDrop{0%{opacity:0;transform:translateY(-130%) rotate(-30deg)}55%{opacity:1}100%{opacity:1;transform:none}}

/* ---------- button transition: 1 = fill from centre (live) ---------- */
.cta{position:relative;z-index:1;margin-top:8px;width:270px;max-width:70%;height:50px;display:grid;place-items:center}
.cta > *{grid-area:1/1}
.cta .frame{width:100%;height:100%;border-radius:999px;border:1px solid var(--pink);opacity:0;animation:frameIn .7s 2.2s ease forwards, frameOut .35s 4.2s ease forwards}
@keyframes frameIn{from{opacity:0;transform:scale(.94)}to{opacity:.55;transform:none}}
@keyframes frameOut{to{opacity:0}}
.cta .pwl{display:flex;align-items:center;gap:12px;opacity:0;animation:pwIn .7s 2.15s ease forwards, pwOut .55s 3.7s ease-in forwards}
.cta .pwl span{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cta .pwl svg{height:28px;width:108px;flex:none}
@keyframes pwIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pwOut{to{opacity:0;transform:scale(.86);filter:blur(5px)}}
.cta .enter{width:100%;height:100%;border:0;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;box-shadow:0 10px 30px rgba(156,48,100,.25);
  clip-path:inset(0 50% 0 50% round 999px);animation:fillOut .75s 3.9s cubic-bezier(.65,0,.25,1) forwards}
.cta .enter span{opacity:0;display:inline-block;animation:txtIn .45s 4.4s ease forwards}
@keyframes fillOut{to{clip-path:inset(0 0 0 0 round 999px)}}
@keyframes txtIn{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.24em}}
.cta .ring{display:none;width:100%;height:100%;overflow:visible}

/* 2 = line trace: a pink line runs round the pill, then the button glows on */
[data-trans=trace] .cta .frame{display:none}
[data-trans=trace] .cta .ring{display:block;animation:frameOut .3s 4.5s ease forwards}
[data-trans=trace] .cta .ring rect{fill:none;stroke:var(--pink);stroke-width:1.5;stroke-dasharray:100 100;stroke-dashoffset:100;animation:ring .9s 3.1s cubic-bezier(.6,0,.3,1) forwards}
@keyframes ring{to{stroke-dashoffset:0}}
[data-trans=trace] .cta .pwl{animation:pwIn .7s 2.15s ease forwards, pwOut .5s 3.85s ease-in forwards}
[data-trans=trace] .cta .enter{clip-path:none;opacity:0;transform:scale(.96);animation:popIn .55s 4.05s ease forwards}
[data-trans=trace] .cta .enter span{animation:txtIn .45s 4.3s ease forwards}
@keyframes popIn{to{opacity:1;transform:none}}

/* 3 = slide swap: the credit slides up and away as the button slides up into its place */
[data-trans=slide] .cta{overflow:hidden;border-radius:999px}
[data-trans=slide] .cta .pwl{animation:pwIn .7s 2.15s ease forwards, slideOut .6s 3.7s cubic-bezier(.6,0,.3,1) forwards}
[data-trans=slide] .cta .frame{animation:frameIn .7s 2.2s ease forwards, frameOut .3s 4.0s ease forwards}
[data-trans=slide] .cta .enter{clip-path:none;transform:translateY(130%);animation:slideIn .65s 3.8s cubic-bezier(.3,1.25,.5,1) forwards}
[data-trans=slide] .cta .enter span{animation:txtIn .45s 4.15s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateY(-130%)}}
@keyframes slideIn{to{transform:none}}

/* 4 = side wipe: the button wipes in from the left, pushing the credit out */
[data-trans=wipe] .cta .pwl{animation:pwIn .7s 2.15s ease forwards, wipeOut .8s 3.75s cubic-bezier(.65,0,.25,1) forwards}
[data-trans=wipe] .cta .enter{clip-path:inset(0 100% 0 0 round 999px);animation:wipe .8s 3.75s cubic-bezier(.65,0,.25,1) forwards}
[data-trans=wipe] .cta .enter span{animation:txtIn .45s 4.3s ease forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0 round 999px)}}
@keyframes wipeOut{to{opacity:0;clip-path:inset(0 0 0 100%)}}

/* 5 = dissolve wipe: the button dissolves in through a soft edge travelling left to right; the credit dissolves out ahead of it */
[data-trans=dissolve] .cta .enter{clip-path:none;-webkit-mask-image:linear-gradient(90deg,#000 0 40%,transparent 60% 100%);mask-image:linear-gradient(90deg,#000 0 40%,transparent 60% 100%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:dissolveIn 1s 3.75s cubic-bezier(.55,0,.35,1) forwards}
[data-trans=dissolve] .cta .enter span{animation:txtIn .45s 4.3s ease forwards}
[data-trans=dissolve] .cta .pwl{-webkit-mask-image:linear-gradient(90deg,transparent 0 40%,#000 60% 100%);mask-image:linear-gradient(90deg,transparent 0 40%,#000 60% 100%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:pwIn .7s 2.15s ease forwards, dissolveOut .9s 3.7s cubic-bezier(.55,0,.35,1) forwards}
[data-trans=dissolve] .cta .frame{animation:frameIn .7s 2.2s ease forwards, frameOut .4s 4.35s ease forwards}
@keyframes dissolveIn{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes dissolveOut{0%{-webkit-mask-position:100% 0;mask-position:100% 0;filter:blur(0)}100%{-webkit-mask-position:0 0;mask-position:0 0;filter:blur(3px)}}
@media (prefers-reduced-motion:reduce){.stage *,.stage{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fd-logo" viewBox="0 0 1214 314">__FUNDABLE_LOGO_PATHS__</symbol>
  <symbol id="fd-logo-dark" viewBox="0 0 1214 314">__FUNDABLE_LOGO_PATHS_DARK__</symbol>
</svg>
<header>__AS_HEADER_SVG__<div class="app">Dynamics · Options</div></header>

<div class="wrap">
  <aside class="panel">
    <h2>Pick your dynamics</h2>
    <p class="lead">Mix and match the three moving parts of the splash. Each choice replays straight away.</p>
    <div class="grp"><h3>Logo intro</h3><div class="opts" id="intro">
      <button data-v="spark"><b>A</b><span>LED spark</span><small>A pink spark runs round each letter in turn, then the apple.</small></button>
      <button data-v="neon"><b>B</b><span>Neon flicker</span><small>Letters buzz on in a random order like a neon sign, and keep a soft glow.</small></button>
      <button data-v="draw"><b>C</b><span>Pen draw <em>Live</em></span><small>The outline draws itself, then the colour floods in.</small></button>
      <button data-v="shimmer"><b>D</b><span>Gloss shimmer</span><small>Letters rise in, then a glossy highlight sweeps across the word.</small></button>
      <button data-v="bounce"><b>E</b><span>Bounce drop</span><small>Letters drop in one by one, and the apple lands on top.</small></button>
    </div></div>
    <div class="grp"><h3>Button transition</h3><div class="opts" id="trans">
      <button data-v="fill"><b>1</b><span>Fill from centre <em>Live</em></span><small>The credit blurs away as the button fills out from the middle of the pill.</small></button>
      <button data-v="trace"><b>2</b><span>Line trace</span><small>A pink line runs round the pill, then the button glows on.</small></button>
      <button data-v="slide"><b>3</b><span>Slide swap</span><small>The credit slides up and away as the button slides up into its place.</small></button>
      <button data-v="wipe"><b>4</b><span>Side wipe</span><small>The button wipes in from the left, pushing the credit out.</small></button>
      <button data-v="dissolve"><b>5</b><span>Dissolve wipe</span><small>The button dissolves in through a soft edge moving left to right; the credit dissolves away ahead of it.</small></button>
    </div></div>
    <div class="grp"><h3>Background</h3><div class="opts" id="bg">
      <button data-v="orbs"><b>i</b><span>Drifting light</span><small>Soft pink light drifting slowly.</small></button>
      <button data-v="aurora"><b>ii</b><span>Aurora shift <em>Live</em></span><small>The whole background slowly shifts through brand pinks.</small></button>
      <button data-v="sparkle"><b>iii</b><span>Sparkle</span><small>Drifting light plus tiny twinkling pink lights.</small></button>
      <button data-v="still"><b>iv</b><span>Still</span><small>No background movement; the logo does all the work.</small></button>
    </div></div>
  </aside>

  <section>
    <div class="bar">
      <button class="btn" id="replay">↻ Replay</button>
      <button class="btn ghost" id="slow" aria-pressed="false">Slow-mo</button>
      <button class="btn ghost" id="theme">Dark</button>
      <span class="combo" id="combo"></span>
    </div>
    <div class="stage" id="stage">
      <div class="orb o1"></div><div class="orb o2"></div>
      <div class="sparkles" id="sparkles"></div>
      <div class="lw">__AS_SPLASH_SVG__</div>
      <h4>Eligibility Checker</h4>
      <div class="cta">
        <div class="frame"></div>
        <svg class="ring" viewBox="0 0 270 50" preserveAspectRatio="none" aria-hidden="true"><rect x=".75" y=".75" width="268.5" height="48.5" rx="24.25" pathLength="100"/></svg>
        <div class="pwl"><span>Powered by</span><svg class="on-light" viewBox="0 0 1214 314" aria-label="Fundable"><use href="#fd-logo-dark"/></svg><svg class="on-dark" viewBox="0 0 1214 314" aria-label="Fundable"><use href="#fd-logo"/></svg></div>
        <div class="enter" style="display:grid;place-items:center"><span>Click to enter</span></div>
      </div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const S={intro:'draw',trans:'fill',bg:'aurora'}, LIVE={intro:'draw',trans:'fill',bg:'aurora'};
const NAMES={spark:'A',neon:'B',draw:'C',shimmer:'D',bounce:'E',fill:'1',trace:'2',slide:'3',wipe:'4',dissolve:'5',orbs:'i',aurora:'ii',sparkle:'iii',still:'iv'};
let rate=1, shineRAF=0;

// one-time prep of the stage template: shimmer gradient, neon order, sparkles
(function prep(){
  const svg=document.querySelector('#stage .aslogo');
  const ns='http://www.w3.org/2000/svg';
  const defs=document.createElementNS(ns,'defs');
  defs.innerHTML='<linearGradient id="asShine" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="40">'+
    '<stop offset="0" style="stop-color:var(--logo-fill)"/><stop offset=".42" style="stop-color:var(--logo-fill)"/>'+
    '<stop offset=".5" style="stop-color:var(--shine)"/><stop offset=".58" style="stop-color:var(--logo-fill)"/><stop offset="1" style="stop-color:var(--logo-fill)"/></linearGradient>';
  svg.prepend(defs);
  const order=[3,0,6,1,8,4,9,2,7,5];
  svg.querySelectorAll('.lt').forEach((p,i)=>p.style.setProperty('--o',order[i%order.length]));
  $('sparkles').innerHTML=Array.from({length:34},(_,i)=>{ const r=(n)=>((Math.sin(i*928.37+n*13.1)+1)/2);
    return `<i style="left:${(r(1)*96+2).toFixed(1)}%;top:${(r(2)*92+4).toFixed(1)}%;--s:${(2+r(3)*4).toFixed(1)}px;--d:${(2.2+r(4)*2.6).toFixed(2)}s;--w:${(r(5)*3).toFixed(2)}s"></i>`; }).join('');
})();

function shimmer(stage){ // sweep the gloss gradient across the word (x from -200 to 640), 0.9s in, over 1.3s
  cancelAnimationFrame(shineRAF); if(S.intro!=='shimmer') return;
  const g=stage.querySelector('#asShine'), t0=performance.now();
  const step=now=>{ const t=(now-t0)/1000*rate, k=Math.min(1,Math.max(0,(t-.9)/1.3)), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, x=-200+e*840;
    g.setAttribute('x1',x); g.setAttribute('x2',x+200); if(k<1) shineRAF=requestAnimationFrame(step); };
  shineRAF=requestAnimationFrame(step);
}
function readyAt(stage){ // when the last one-off animation finishes = when "Click to enter" is ready
  const ends=stage.getAnimations({subtree:true}).filter(a=>a.effect.getTiming().iterations!==Infinity && a.animationName!=='aurora').map(a=>a.effect.getComputedTiming().endTime);
  return Math.max(...ends,0)/1000;
}
function play(){
  const old=$('stage'), st=old.cloneNode(true);
  st.dataset.intro=S.intro; st.dataset.trans=S.trans; st.dataset.bg=S.bg;
  old.replaceWith(st);
  st.getAnimations({subtree:true}).forEach(a=>a.playbackRate=rate);
  shimmer(st);
  const live=S.intro===LIVE.intro&&S.trans===LIVE.trans&&S.bg===LIVE.bg;
  $('combo').innerHTML=`Combo <b>${NAMES[S.intro]}${NAMES[S.trans]} · ${NAMES[S.bg]}</b> · ready at <b>${readyAt(st).toFixed(2)}s</b>${live?'<span class="live">Live now</span>':''}`;
  ['intro','trans','bg'].forEach(k=>$(k).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S[k]))));
}
['intro','trans','bg'].forEach(k=>$(k).onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S[k]=b.dataset.v; play(); });
$('replay').onclick=play;
$('slow').onclick=()=>{ rate=rate===1?.4:1; $('slow').setAttribute('aria-pressed',String(rate!==1)); play(); };
const setTheme=t=>{ document.documentElement.setAttribute('data-theme',t); $('theme').textContent=t==='dark'?'Light':'Dark'; };
$('theme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
setTheme('light'); play();
</script>
</body>
